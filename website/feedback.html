<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - E-Plastic Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .feedback-container { max-width: 420px; margin: 2.5rem auto; background: #f8fbff; border-radius: 12px; box-shadow: 0 2px 12px rgba(46,134,193,0.08); padding: 2rem 2.5rem; }
        .feedback-container h2 { color: #2e86c1; margin-bottom: 1.2rem; }
        .feedback-rank { margin: 1.2rem 0; }
        .feedback-rank label { margin-right: 1.2rem; font-weight: 500; }
        .feedback-message { margin-top: 1.5rem; font-size: 1.1rem; color: #2e86c1; }
    </style>
</head>
<body>
    <header>
        <h1>Feedback</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>
    <main>
        <div class="feedback-container">
            <form id="feedback-form">
                <h2>How was your experience?</h2>
                <label for="fb-name">Your Name:</label>
                <input type="text" id="fb-name" name="fb-name" required style="margin-bottom:1rem;width:100%;padding:0.5rem;">
                <div class="feedback-rank">
                    <label><input type="radio" name="fb-rank" value="5" required> Best</label>
                    <label><input type="radio" name="fb-rank" value="4"> Good</label>
                    <label><input type="radio" name="fb-rank" value="3"> Average</label>
                    <label><input type="radio" name="fb-rank" value="2"> Poor</label>
                    <label><input type="radio" name="fb-rank" value="1"> Worst</label>
                </div>
                <button type="submit" class="cta-btn">Submit Feedback</button>
                <div id="feedback-message" class="feedback-message"></div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 E-Plastic Management</p>
    </footer>
    <script src="{{ url_for('static', filename='feedback.js') }}"></script>
</body>
</html>
