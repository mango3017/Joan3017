<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recyclability Result - E-Plastic Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .result-container {
            max-width: 600px;
            margin: 2rem auto;
            background: #f8fbff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(46,134,193,0.08);
            padding: 2rem 2.5rem;
            text-align: center;
        }
        .result-title {
            color: #2e86c1;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .recyclable {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .not-recyclable {
            color: #c0392b;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .instructions {
            margin: 1.5rem 0;
            text-align: left;
        }
        .examples {
            background: #e3f0fc;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            color: #2e86c1;
        }
        .back-btn {
            margin-top: 2rem;
            display: inline-block;
            background: #2e86c1;
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #145a8a;
        }
    </style>
</head>
<body>
    <header>
        <h1>Recyclability Result</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>
    <main>
        <div style="max-width:600px;margin:1rem auto 0;text-align:center;">
            <label for="user-location" style="font-weight:500;">Enter your location (address, city, or landmark):</label>
            <input type="text" id="user-location" placeholder="e.g. Bengaluru, Karnataka" style="width:70%;padding:0.5rem;margin:0.5rem 0;border-radius:5px;border:1px solid #b2bec3;">
            <button id="set-location-btn" style="padding:0.5rem 1.2rem;border-radius:5px;background:#2e86c1;color:#fff;border:none;font-weight:500;cursor:pointer;">Set Location</button>
            <button id="get-current-location-btn" style="padding:0.5rem 1.2rem;border-radius:5px;background:#27ae60;color:#fff;border:none;font-weight:500;cursor:pointer;margin-left:0.5rem;">Use Current Location</button>
            <div id="location-error" style="color:#c0392b;margin-top:0.5rem;display:none;"></div>
        </div>
        <div class="result-container" id="result-container">
            <!-- Result and recycling centers with directions buttons will be injected here by JS -->
        </div>
    </main>
    <footer>
        <p>&copy; 2025 E-Plastic Management</p>
    </footer>
    <script src="{{ url_for('static', filename='result.js') }}"></script>
</body>
</html>
